name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1
  ECR_REGISTRY: 262872409051.dkr.ecr.il-central-1.amazonaws.com
  INSTANCE_ID: i-0d472203470d241e7

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262872409051:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image (arm64 — matches the Graviton EC2 host)
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/backoffice-backend:latest

      - name: Build and push frontend image (arm64 — matches the Graviton EC2 host)
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/backoffice-frontend:latest

      - name: Trigger deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region il-central-1 | sudo docker login --username AWS --password-stdin 262872409051.dkr.ecr.il-central-1.amazonaws.com",
              "sudo -u ec2-user /home/ec2-user/app/fetch-env.sh",
              "cd /home/ec2-user/app && sudo docker compose pull",
              "cd /home/ec2-user/app && sudo docker compose up -d --remove-orphans"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
            echo "status: $STATUS"
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command failed with status: $STATUS"
            exit 1
          fi
