name: CI

# Runs on every pull request into main. Builds and tests only - no deploy, no AWS,
# no secrets. All credentials below are throwaway values for the ephemeral test database.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backoffice_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d backoffice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/backoffice_test
      DB_USERNAME: ci
      DB_PASSWORD: ci-test-password
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-test-admin-password
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production, same configuration as the deploy image)
        run: npm run build -- --configuration production

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
