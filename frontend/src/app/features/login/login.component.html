<div class="login-page">
  <form class="card login-card" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark"><svg lucideScale class="icon"></svg></span>
      <span class="brand-name">המערכת שלי</span>
    </div>
    <p class="login-subtitle">כניסה לאזור הניהול</p>

    <div class="field-group">
      <label class="field-label">אימייל</label>
      <input
        class="input-field"
        type="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
      />
    </div>

    <div class="field-group">
      <label class="field-label">סיסמה</label>
      <input
        class="input-field"
        type="password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
      />
    </div>

    @if (error()) {
      <p class="login-error">{{ error() }}</p>
    }

    <button class="btn btn-primary full-width" type="submit" [disabled]="loading()">
      {{ loading() ? 'מתחברת...' : 'כניסה' }}
    </button>
  </form>
</div>
